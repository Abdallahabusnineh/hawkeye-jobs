# Experiment: imitate Smart App Control on a Windows runner (Microsoft's own SAC policy,
# enforced with CiTool), then run site/sac-check.ps1 under it. Manual runs only.
name: Smart App Control simulation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: What this runner has
        shell: pwsh
        run: |
          [System.Environment]::OSVersion.VersionString
          (Get-CimInstance Win32_OperatingSystem).Caption
          Get-ChildItem "$env:windir\schemas\CodeIntegrity\ExamplePolicies" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
          Get-Command CiTool.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          Get-Module -ListAvailable ConfigCI | Select-Object Name, Version
