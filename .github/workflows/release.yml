# Builds the app for macOS (Apple Silicon and Intel), Windows and Linux.
# Push a tag like v1.0.0 to publish a GitHub release; run it by hand to only build.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  build:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: HawkeyeJobs-macOS-AppleSilicon.dmg
          - os: macos-15-intel
            asset: HawkeyeJobs-macOS-Intel.dmg
          - os: windows-latest
            asset: HawkeyeJobs-Windows.zip
          - os: ubuntu-22.04
            asset: HawkeyeJobs-Linux.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'src'); from version import __version__; print(__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match src/version.py ($version)"; exit 1
          fi

      - name: Build
        run: python -m PyInstaller packaging/hawkeye.spec --noconfirm

      - name: Smoke test (starts, serves the window, quits)
        run: python packaging/smoke_test.py

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p staging
          cp -R "dist/Hawkeye Jobs.app" staging/
          ln -s /Applications staging/Applications
          hdiutil create -volname "Hawkeye Jobs" -srcfolder staging -ov -format UDZO "${{ matrix.asset }}"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/Hawkeye Jobs" -DestinationPath "${{ matrix.asset }}"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf "${{ matrix.asset }}" "Hawkeye Jobs"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --title "Hawkeye Jobs $GITHUB_REF_NAME" \
            --notes-file packaging/RELEASE_NOTES.md
