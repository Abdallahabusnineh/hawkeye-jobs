# Builds the app for macOS (Apple Silicon and Intel), Windows and Linux.
# Push a tag like v1.0.0 to publish a GitHub release; run it by hand to only build.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  build:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macos-applesilicon
            sign: true
          - os: macos-15-intel
            artifact: macos-intel
            sign: true
          - os: windows-latest
            artifact: windows
          - os: ubuntu-22.04
            artifact: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240  # macOS notarization can take hours for a new developer account
    # Release builds for macOS run in the protected "release-signing" environment: its secrets
    # (Developer ID certificate, notarization password) exist only there, every use waits for the
    # owner's approval, and only v* tags may deploy to it. Other builds never see them.
    environment: ${{ matrix.sign && startsWith(github.ref, 'refs/tags/') && 'release-signing' || '' }}
    env:
      SIGN: ${{ matrix.sign && startsWith(github.ref, 'refs/tags/') && 'yes' || 'no' }}
      APPLE_TEAM_ID: 5QK2GF6VU8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'src'); from version import __version__; print(__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match src/version.py ($version)"; exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Import the signing certificate (macOS releases)
        if: env.SIGN == 'yes'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ] || [ -z "$MACOS_CERT_PASSWORD" ]; then
            echo "Signing secrets are missing: refusing to publish an unsigned macOS release."; exit 1
          fi
          # A throwaway keychain that exists only for this job; deleted in the last step.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          if [ -z "$identity" ]; then echo "No Developer ID Application identity in the certificate."; exit 1; fi
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"

      - name: Build
        run: python -m PyInstaller packaging/hawkeye.spec --noconfirm

      - name: Smoke test (starts, serves the window, quits)
        run: python packaging/smoke_test.py

      - name: Notarize the app (macOS releases)
        if: env.SIGN == 'yes'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent "dist/Hawkeye Jobs.app" "$RUNNER_TEMP/app.zip"
          bash packaging/macos/notarize.sh "$RUNNER_TEMP/app.zip"
          bash packaging/macos/staple.sh "dist/Hawkeye Jobs.app"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          asset=HawkeyeJobs-macOS-AppleSilicon.dmg
          [ "$(uname -m)" = "arm64" ] || asset=HawkeyeJobs-macOS-Intel.dmg
          mkdir -p staging out
          cp -R "dist/Hawkeye Jobs.app" staging/
          ln -s /Applications staging/Applications
          hdiutil create -volname "Hawkeye Jobs" -srcfolder staging -ov -format UDZO "out/$asset"
          echo "MAC_ASSET=out/$asset" >> "$GITHUB_ENV"

      - name: Sign and notarize the disk image (macOS releases)
        if: env.SIGN == 'yes'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          codesign --sign "$MACOS_SIGN_IDENTITY" --timestamp "$MAC_ASSET"
          bash packaging/macos/notarize.sh "$MAC_ASSET"
          bash packaging/macos/staple.sh "$MAC_ASSET"
          # What a user's Mac will check: the app inside opens without any warning.
          spctl --assess --type open --context context:primary-signature --verbose "$MAC_ASSET"
          spctl --assess --type execute --verbose "dist/Hawkeye Jobs.app"

      - name: Remove the signing keychain
        if: always() && env.KEYCHAIN_PATH != ''
        run: security delete-keychain "$KEYCHAIN_PATH" || true

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path "dist/Hawkeye Jobs" -DestinationPath out/HawkeyeJobs-Windows.zip
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $version = if ($env:APP_VERSION) { $env:APP_VERSION } else { "0.0.0" }
          & $iscc "/DAppVersion=$version" packaging\windows\hawkeye.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item dist/HawkeyeJobs-Windows-Setup.exe out/
      - name: Installer test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process out/HawkeyeJobs-Windows-Setup.exe -Wait -PassThru -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          python packaging/smoke_test.py "$env:LOCALAPPDATA\Programs\Hawkeye Jobs\Hawkeye Jobs.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package (Linux)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          mkdir -p out
          tar -C dist -czf out/HawkeyeJobs-Linux.tar.gz "Hawkeye Jobs"
          bash packaging/linux/build_appimage.sh
          mv dist/HawkeyeJobs-Linux.AppImage out/
          python packaging/smoke_test.py out/HawkeyeJobs-Linux.AppImage

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --title "Hawkeye Jobs $GITHUB_REF_NAME" \
            --notes-file packaging/RELEASE_NOTES.md
