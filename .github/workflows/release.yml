# Builds the app for macOS (Apple Silicon and Intel), Windows and Linux.
# Push a tag like v1.0.0 to publish a GitHub release; run it by hand to only build.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  build:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macos-applesilicon
            sign: true
          - os: macos-15-intel
            artifact: macos-intel
            sign: true
          - os: windows-latest
            artifact: windows
          - os: ubuntu-22.04
            artifact: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240  # macOS notarization can take hours for a new developer account
    # Release builds for macOS run in the protected "release-signing" environment: its secrets
    # (Developer ID certificate, notarization password) exist only there, every use waits for the
    # owner's approval, and only v* tags may deploy to it. Other builds never see them.
    environment: ${{ matrix.sign && startsWith(github.ref, 'refs/tags/') && 'release-signing' || '' }}
    env:
      SIGN: ${{ matrix.sign && startsWith(github.ref, 'refs/tags/') && 'yes' || 'no' }}
      APPLE_TEAM_ID: 5QK2GF6VU8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'src'); from version import __version__; print(__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match src/version.py ($version)"; exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Import the signing certificate (macOS releases)
        if: env.SIGN == 'yes'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ] || [ -z "$MACOS_CERT_PASSWORD" ]; then
            echo "Signing secrets are missing: refusing to publish an unsigned macOS release."; exit 1
          fi
          # A throwaway keychain that exists only for this job; deleted in the last step.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          if [ -z "$identity" ]; then echo "No Developer ID Application identity in the certificate."; exit 1; fi
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"

      - name: Build
        run: python -m PyInstaller packaging/hawkeye.spec --noconfirm

      - name: Smoke test (starts, serves the window, quits)
        run: python packaging/smoke_test.py

      - name: Notarize the app (macOS releases)
        if: env.SIGN == 'yes'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent "dist/Hawkeye Jobs.app" "$RUNNER_TEMP/app.zip"
          bash packaging/macos/notarize.sh "$RUNNER_TEMP/app.zip"
          # Notarization is what matters; stapling only lets a first launch work offline. Some
          # runners cannot reach Apple's ticket service (CloudKit -1005), so warn instead of failing:
          # the Mac fetches the ticket online at first launch.
          if bash packaging/macos/staple.sh "dist/Hawkeye Jobs.app"; then
            echo "APP_STAPLED=yes" >> "$GITHUB_ENV"
          else
            echo "::warning::Notarized, but the app could not be stapled (Apple's ticket service unreachable from this runner)."
            echo "APP_STAPLED=no" >> "$GITHUB_ENV"
          fi

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          asset=HawkeyeJobs-macOS-AppleSilicon.dmg
          [ "$(uname -m)" = "arm64" ] || asset=HawkeyeJobs-macOS-Intel.dmg
          mkdir -p staging out
          cp -R "dist/Hawkeye Jobs.app" staging/
          ln -s /Applications staging/Applications
          hdiutil create -volname "Hawkeye Jobs" -srcfolder staging -ov -format UDZO "out/$asset"
          echo "MAC_ASSET=out/$asset" >> "$GITHUB_ENV"

      - name: Sign and notarize the disk image (macOS releases)
        if: env.SIGN == 'yes'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          codesign --sign "$MACOS_SIGN_IDENTITY" --timestamp "$MAC_ASSET"
          bash packaging/macos/notarize.sh "$MAC_ASSET"
          if bash packaging/macos/staple.sh "$MAC_ASSET" && [ "$APP_STAPLED" = "yes" ]; then
            # What a user's Mac will check: the app inside opens without any warning.
            spctl --assess --type open --context context:primary-signature --verbose "$MAC_ASSET"
            spctl --assess --type execute --verbose "dist/Hawkeye Jobs.app"
          else
            # Both notarizations were Accepted (notarize.sh fails otherwise). spctl would need the
            # same unreachable service, so the online check happens on the user's Mac instead.
            echo "::warning::Notarized, but not stapled; skipping the offline Gatekeeper check on this runner."
          fi

      - name: Remove the signing keychain
        if: always() && env.KEYCHAIN_PATH != ''
        run: security delete-keychain "$KEYCHAIN_PATH" || true

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path "dist/Hawkeye Jobs" -DestinationPath out/HawkeyeJobs-Windows.zip
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $version = if ($env:APP_VERSION) { $env:APP_VERSION } else { "0.0.0" }
          & $iscc "/DAppVersion=$version" packaging\windows\hawkeye.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item dist/HawkeyeJobs-Windows-Setup.exe out/
      - name: Installer test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process out/HawkeyeJobs-Windows-Setup.exe -Wait -PassThru -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          python packaging/smoke_test.py "$env:LOCALAPPDATA\Programs\Hawkeye Jobs\Hawkeye Jobs.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package (Microsoft Store)
        if: runner.os == 'Windows'
        run: python packaging/windows/build_msix.py --out store/HawkeyeJobs-Windows-Store.msix
      - name: Store package test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh packaging/windows/test_msix.ps1 store/HawkeyeJobs-Windows-Store.msix
      # Not a release asset: it is unsigned until the Store signs it. Upload it in Partner Center
      # (Hawkeye Jobs > Packages) from this run's "microsoft-store" artifact.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Windows'
        with:
          name: microsoft-store
          path: store/HawkeyeJobs-Windows-Store.msix
          if-no-files-found: error

      - name: Package (Linux)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          mkdir -p out
          tar -C dist -czf out/HawkeyeJobs-Linux.tar.gz "Hawkeye Jobs"
          bash packaging/linux/build_appimage.sh
          mv dist/HawkeyeJobs-Linux.AppImage out/
          python packaging/smoke_test.py out/HawkeyeJobs-Linux.AppImage

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: |
          rm -f assets/*.msix  # the Store package goes to Partner Center, not to the release
          cd assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --title "Hawkeye Jobs $GITHUB_REF_NAME" \
            --notes-file packaging/RELEASE_NOTES.md

  # Sends the new MSIX to the Microsoft Store (product 9PB9XTPR0XH4) after the GitHub release.
  # Off until the repository variable STORE_AUTOPUBLISH is "true" (set it once the Partner Center
  # credentials are in the environment); until then the package is uploaded by hand in Partner
  # Center from the run's "microsoft-store" artifact. Runs in the protected "microsoft-store"
  # environment: the credentials exist only there, every run waits for the owner's approval, and
  # only v* tags (and main, for store-check.yml) may use it.
  store:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/') && vars.STORE_AUTOPUBLISH == 'true'
    runs-on: windows-latest
    environment: microsoft-store
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: microsoft-store
          path: store
      - uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
      - name: Submit the package to the Microsoft Store
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          if (-not ($env:TENANT_ID -and $env:SELLER_ID -and $env:CLIENT_ID -and $env:CLIENT_SECRET)) {
            throw "Partner Center credentials are missing from the microsoft-store environment."
          }
          msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure failed ($LASTEXITCODE)" }
          $msix = (Resolve-Path store/HawkeyeJobs-Windows-Store.msix).Path
          msstore publish $msix --inputFile $msix --appId 9PB9XTPR0XH4
          if ($LASTEXITCODE -ne 0) { throw "msstore publish failed ($LASTEXITCODE)" }
          msstore submission status 9PB9XTPR0XH4
