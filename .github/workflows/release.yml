# Builds the app for macOS (Apple Silicon and Intel), Windows and Linux.
# Push a tag like v1.0.0 to publish a GitHub release; run it by hand to only build.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  build:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macos-applesilicon
          - os: macos-15-intel
            artifact: macos-intel
          - os: windows-latest
            artifact: windows
          - os: ubuntu-22.04
            artifact: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'src'); from version import __version__; print(__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match src/version.py ($version)"; exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: python -m PyInstaller packaging/hawkeye.spec --noconfirm

      - name: Smoke test (starts, serves the window, quits)
        run: python packaging/smoke_test.py

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          asset=HawkeyeJobs-macOS-AppleSilicon.dmg
          [ "$(uname -m)" = "arm64" ] || asset=HawkeyeJobs-macOS-Intel.dmg
          mkdir -p staging out
          cp -R "dist/Hawkeye Jobs.app" staging/
          ln -s /Applications staging/Applications
          hdiutil create -volname "Hawkeye Jobs" -srcfolder staging -ov -format UDZO "out/$asset"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path "dist/Hawkeye Jobs" -DestinationPath out/HawkeyeJobs-Windows.zip
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $version = if ($env:APP_VERSION) { $env:APP_VERSION } else { "0.0.0" }
          & $iscc "/DAppVersion=$version" packaging\windows\hawkeye.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item dist/HawkeyeJobs-Windows-Setup.exe out/
      - name: Installer test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process out/HawkeyeJobs-Windows-Setup.exe -Wait -PassThru -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          python packaging/smoke_test.py "$env:LOCALAPPDATA\Programs\Hawkeye Jobs\Hawkeye Jobs.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package (Linux)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          mkdir -p out
          tar -C dist -czf out/HawkeyeJobs-Linux.tar.gz "Hawkeye Jobs"
          bash packaging/linux/build_appimage.sh
          mv dist/HawkeyeJobs-Linux.AppImage out/
          python packaging/smoke_test.py out/HawkeyeJobs-Linux.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --title "Hawkeye Jobs $GITHUB_REF_NAME" \
            --notes-file packaging/RELEASE_NOTES.md
