# Runs site/sac-check.ps1 on a Windows runner, so the script is known to work before people use it.
# (Runners have no Smart App Control; this checks the script itself, every row should be OK.)
name: Smart App Control check script

on:
  push:
    branches: [main]
    paths: ["site/sac-check.ps1", ".github/workflows/sac-check.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the check script
        shell: pwsh
        run: |
          $out = & ./site/sac-check.ps1 *>&1 | Out-String
          Write-Output $out
          if ($out -notmatch 'RESULT') { exit 1 }
          if ($out -match 'BLOCKED') { Write-Output 'A part was blocked on a runner without Smart App Control: the script is wrong.'; exit 1 }
